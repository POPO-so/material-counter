s CJK SC',sans-serif" text-anchor="middle" font-weight="600">DDR 帧池</text><rect x="832" y="112" width="128" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="848" y="136" font-size="12" fill="#4f5d75" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start" font-weight="600"></text><text x="896.0" y="164" font-size="16" fill="#2d3142" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle" font-weight="600">PL 检测</text><rect x="1088" y="112" width="128" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="1104" y="136" font-size="12" fill="#4f5d75" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start" font-weight="600"></text><text x="1152.0" y="164" font-size="16" fill="#2d3142" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle" font-weight="600">PL 显示</text><line x1="48" y1="656" x2="1232" y2="656" stroke="#bfc0c0" stroke-width="0.8"/><text x="48" y="688" font-size="12" fill="#4f5d75" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start" font-weight="400">帧 n 的图像和结果按 frame_id 配对；计数发生于 PS，实际 HDMI 连续输出发生于 PL。</text></svg>