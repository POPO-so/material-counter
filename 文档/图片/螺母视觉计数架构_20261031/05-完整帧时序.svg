<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="05-完整帧时序-title 05-完整帧时序-desc"><title id="05-完整帧时序-title">05 / 从采集到同帧显示的概念时序</title><desc id="05-完整帧时序-desc">向下表示时间推进，不按比例；采集、检测与显示可以流水并行。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2e5aa8"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><text x="48" y="56" font-size="28" fill="#2d3142" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start" font-weight="600">05 / 从采集到同帧显示的概念时序</text><text x="48" y="88" font-size="16" fill="#4f5d75" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start" font-weight="400">向下表示时间推进，不按比例；采集、检测与显示可以流水并行。</text><path d="M128 176 V624" stroke="#bfc0c0" fill="none" stroke-dasharray="4,4"/><path d="M384 176 V624" stroke="#bfc0c0" fill="none" stroke-dasharray="4,4"/><path d="M640 176 V624" stroke="#bfc0c0" fill="none" stroke-dasharray="4,4"/><path d="M896 176 V624" stroke="#bfc0c0" fill="none" stroke-dasharray="4,4"/><path d="M1152 176 V624" stroke="#bfc0c0" fill="none" stroke-dasharray="4,4"/><path d="M128 216 H384" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="194.0" y="184" width="124" height="24" fill="#f5f5f5"/><text x="256" y="200" font-size="12" fill="#4f5d75" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle" font-weight="400">USB FRAME N</text><path d="M384 264 H640" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="450.0" y="232" width="124" height="24" fill="#f