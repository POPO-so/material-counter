<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="04-计数状态机-title 04-计数状态机-desc"><title id="04-计数状态机-title">04 / 通行状态与一次计数</title><desc id="04-计数状态机-desc">这里展示已确认轨迹的核心状态；新轨迹确认、退休与墓碑记录详见正文。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2e5aa8"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><text x="48" y="56" font-size="28" fill="#2d3142" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start" font-weight="600">04 / 通行状态与一次计数</text><text x="48" y="88" font-size="16" fill="#4f5d75" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start" font-weight="400">这里展示已确认轨迹的核心状态；新轨迹确认、退休与墓碑记录详见正文。</text><path d="M256 264 H384" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="262.0" y="232" width="116" height="24" fill="#f5f5f5"/><text x="320" y="248" font-size="12" fill="#4f5d75" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle" font-weight="400">OBSERVED U</text><path d="M576 264 H704" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="596.0" y="232" width="88" height="24" fill="#f5f5f5"/><text x="640" y="248" font-size="12" fill="#4f5d75" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle" font-weight="400">ENTER G</text><path d="M896 264 H1024" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/><rect x="916.0" y="232" width="88" height="24" fill="#f5f5f5"/><text x="960" y="248" font-size="12" fill="#eb6c36" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle" font-weight="400">REACH D</text><path d="M768 208 V136 Q768 128 760 128 H488 Q480 128 480 136 V208" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="8,4" marker-end="url(#arrow)"/><rect x="576.0" y="96" width="96" height="24" fill="#f5f5f5"/><text x="624" y="112" font-size="12" fill="#4f5d75" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle" font-weight="400">RETURN U</text><path d="M768 320 V424" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="674.0" y="356" width="60" height="24" fill="#f5f5f5"/><text x="704" y="372" font-size="12" fill="#4f5d75" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle" font-weight="400">LOST</text><path d="M832 424 V320" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="8,4" marker-end="url(#arrow)"/><path d="M704 480 H576" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="586.0" y="448" width="108" height="24" fill="#f5f5f5"/><text x="640" y="464" font-size="12" fill="#4f5d75" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle" font-weight="400">AMBIGUOUS</text><path d="M1152 208 V152 Q1152 144 1160 144 H1224 Q1232 144 1232 152 V264 Q1232 272 1224 272 H1216" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="8,4" marker-end="url(#arrow)"/><rect x="64" y="208" width="192" height="112" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="80" y="232" font-size="12" fill="#4f5d75" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start" font-weight="600">CONFIRMED</text><text x="160.0" y="260" font-size="20" fill="#2d3142" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle" font-weight="600">已确认</text><text x="160.0" y="288" font-size="12" fill="#4f5d75" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle" font-weight="400">尚未建立上游证据</text><rect x="384" y="208" width="192" height="112" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="400" y="232" font-size="12" fill="#4f5d75" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start" font-weight="600">ARMED</text><text x="480.0" y="260" font-size="20" fill="#2d3142" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle" font-weight="600">已准备</text><text x="480.0" y="288" font-size="12" fill="#4f5d75" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle" font-weight="400">在上游区域 U</text><rect x="704" y="208" width="192" height="112" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="720" y="232" font-size="12" fill="#4f5d75" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start" font-weight="600">PASSING</text><text x="800.0" y="260" font-size="20" fill="#2d3142" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle" font-weight="600">正在通行</text><text x="800.0" y="288" font-size="12" fill="#4f5d75" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle" font-weight="400">进入计数带 G</text><rect x="1024" y="208" width="192" height="112" rx="8" fill="#fdefe8" stroke="#eb6c36" stroke-width="1.2"/><text x="1040" y="232" font-size="12" fill="#4f5d75" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start" font-weight="600">COUNTED</text><text x="1120.0" y="260" font-size="20" fill="#2d3142" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle" font-weight="600">已计数</text><text x="1120.0" y="288" font-size="12" fill="#4f5d75" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle" font-weight="400">提交唯一事件</text><rect x="704" y="424" width="192" height="112" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="720" y="448" font-size="12" fill="#4f5d75" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start" font-weight="600">LOST</text><text x="800.0" y="476" font-size="20" fill="#2d3142" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle" font-weight="600">暂时丢失</text><text x="800.0" y="504" font-size="12" fill="#4f5d75" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle" font-weight="400">仅唯一恢复才续接</text><rect x="384" y="424" width="192" height="112" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="400" y="448" font-size="12" fill="#4f5d75" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start" font-weight="600">AMBIGUOUS</text><text x="480.0" y="476" font-size="20" fill="#2d3142" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle" font-weight="600">身份不确定</text><text x="480.0" y="504" font-size="12" fill="#4f5d75" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle" font-weight="400">报告异常，不强行补数</text><text x="1112" y="360" font-size="12" fill="#4f5d75" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle" font-weight="400">短倒退保持已计数</text><text x="824" y="568" font-size="12" fill="#4f5d75" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle" font-weight="400">向上虚线：身份唯一恢复</text><text x="512" y="616" font-size="16" fill="#4f5d75" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle" font-weight="400">双区域滞回 + 身份保持 + 已计数记录；单个 counted 标志不能保证物理身份不丢失。</text><line x1="48" y1="656" x2="1232" y2="656" stroke="#bfc0c0" stroke-width="0.8"/><text x="48" y="688" font-size="12" fill="#4f5d75" font-family="'Geist','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="start" font-weight="400">实线：数据或状态流；虚线：控制、恢复或重复扫描；所有架构均为建议</text></svg>